name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the job to publish to Pages via the official actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel an in-flight release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0 — pin to 22 for a supported,
          # reproducible toolchain on the runner.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # This repository is a GitHub *Project* Pages site, served from
          # https://never87.github.io/Never87NovelStudio/ . Vite must emit asset
          # URLs under that sub-path, otherwise the deployed page loads no CSS
          # or JS and renders a blank screen.
          #
          # Must stay identical to the repository name. Change this (or point it
          # at a repository variable) only if the site moves to a different
          # sub-path or to a user site, where it must be '/'.
          VITE_BASE_PATH: /Never87NovelStudio/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
